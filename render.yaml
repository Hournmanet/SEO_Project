# render.yaml
databases:
  - name: seo-db
    databaseName: seo_project_db
    user: postgres
    plan: free

services:
  - type: web
    name: seo-project
    env: php
    plan: free
    buildCommand: "composer install --no-dev --optimize-autoloader"
    startCommand: "php -S 0.0.0.0:$PORT"
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: seo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: seo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: seo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: seo-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: seo-db
          property: password