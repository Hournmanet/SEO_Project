# render.yaml - Optimized Docker + PostgreSQL Blueprint for Render
databases:
  - name: seo-db
    databaseName: seo_project_db
    plan: free

services:
  - type: web
    name: seo-project
    env: docker
    plan: free
    autoDeploy: true
    # Docker uses EXPOSE in Dockerfile, so we don't need startCommand here
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: seo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: seo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: seo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: seo-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: seo-db
          property: password
