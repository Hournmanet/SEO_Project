# render.yaml - Working PHP + PostgreSQL Blueprint for Render
databases:
  - name: seo-db
    databaseName: seo_project_db
    user: postgres
    plan: free

services:
  - type: web
    name: seo-project
    env: php
    plan: free
    autoDeploy: true
    startCommand: php -S 0.0.0.0:10000 -t .
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: seo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: seo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: seo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: seo-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: seo-db
          property: password