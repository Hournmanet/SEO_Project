# render.yaml - Fully working for PHP + PostgreSQL on Render

databases:
  - name: seo-db
    databaseName: seo_project_db
    user: postgres       # must be lowercase letters only
    plan: free

services:
  - type: web
    name: seo-project
    env: php              # Use native PHP environment (simpler than Docker)
    plan: free
    autoDeploy: true
    buildCommand: ""      # leave empty for PHP projects
    startCommand: ""      # PHP buildpack automatically serves index.php
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: seo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: seo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: seo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: seo-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: seo-db
          property: password