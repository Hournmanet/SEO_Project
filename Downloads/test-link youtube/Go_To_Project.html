<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go to Video Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(45deg, #6B46C1, #805AD5);
            color: white;
            text-align: center;
        }
        .container {
            padding: 2.5rem;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            width: 400px;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: #ED64A6;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(237, 100, 166, 0.4);
        }
        .btn:hover {
            background: #D53F8C;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(237, 100, 166, 0.6);
        }
        .btn:active {
            transform: translateY(1px);
        }
        h1 {
            margin-bottom: 1rem;
            font-size: 2rem;
        }
        p {
            margin-bottom: 1.5rem;
            opacity: 0.9;
            line-height: 1.5;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="icon">🎬</span>
        <h1>Video Collection</h1>
        <p>Click the button below to access the complete video collection</p>
        <a href="http://localhost:8000/test.html" class="btn">Open Video Collection</a>
    </div>
</body>
</html>
